<html lang="pt-BR">

<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Estúdio de animação</title>

{"imports":{"three":"./node_modules/three/build/three.module.js","three/addons/":"./node_modules/three/examples/jsm/"}}

<style>
  :root { color-scheme: dark; --bg: #1b1820; --surface: #29252f; --text: #f3ebdc; --muted: #c7bccc; --accent: #f2a283; --line: #5e5265; }
  * { box-sizing: border-box; }
  [hidden] { display: none !important; }
  body { margin: 0; background: var(--bg); color: var(--text); font: 15px/1.5 system-ui, sans-serif; }
  main { padding: 20px; max-width: 1440px; margin: auto; }
  h1 { font-size: 24px; margin: 0 0 16px; }
  #out { display: block; width: 100%; aspect-ratio: 16 / 9; height: auto; background: #f3ebdc; }
  .p5Canvas { display: none !important; }
  .bar { display: flex; flex-wrap: wrap; gap: 12px; align-items: center; margin: 14px 0; }
  .bar label { display: flex; gap: 8px; align-items: center; }
  select, button { font: inherit; color: var(--text); background: var(--surface); border: 1px solid var(--line); border-radius: 6px; padding: 8px 12px; min-height: 42px; }
  button { cursor: pointer; }
  button:hover, select:hover { border-color: var(--accent); }
  button:disabled { cursor: wait; opacity: .6; }
  :focus-visible { outline: 3px solid var(--accent); outline-offset: 3px; }
  ::selection { background: var(--accent); color: var(--bg); }
  #scrub { flex: 1; min-width: 140px; accent-color: var(--accent); }
  #tt { font-variant-numeric: tabular-nums; color: var(--muted); min-width: 200px; }
  #error { color: #ffc4b6; }
  #error:empty { display: none; }
  #story { max-width: 75ch; color: var(--muted); }
  #shots { padding: 0; list-style: none; display: grid; gap: 12px; }
  #shots li { padding: 12px 0; border-top: 1px solid var(--line); }
  #shots p { margin: 6px 0; color: var(--muted); }
  #shots button[aria-current="true"] { border-color: var(--accent); color: var(--accent); }
  input { caret-color: var(--accent); }
  * { scrollbar-color: var(--line) var(--bg); }
  @media (max-width: 600px) { main { padding: 12px; } .bar label { width: 100%; } select { flex: 1; min-width: 0; } #tt { width: 100%; } }
</style>
</head>
<body>
<main>
  <h1>Estúdio de animação</h1>
  <div class="bar">
    <label>Projeto <select id="project" aria-label="Projeto" disabled></select></label>
    <label>Estilo <select id="style" aria-label="Estilo visual" disabled></select></label>
    <label id="quality-label" hidden>Prévia <select id="quality" aria-label="Qualidade da prévia"><option value="light">Leve</option><option value="final">Final</option></select></label>
  </div>
  <canvas id="out" width="1920" height="1080" aria-label="Prévia do vídeo"></canvas>
  <div class="bar">
    <button id="play" disabled>Reproduzir</button>
    <input id="scrub" aria-label="Tempo do vídeo" type="range" min="0" max="11" step="0.041666667" value="0" disabled>
    <span id="tt" role="status">Carregando projeto…</span>
    <button id="save" disabled>Salvar quadro PNG</button>
  </div>
  <p id="error" role="alert"></p>
  <p id="story"></p>
  <ol id="shots" aria-label="Storyboard"></ol>
</main>
<script src="src/platform.js"></script>
<script src="src/styles/watercolor/config.js"></script>
<script src="src/styles/cartoon/config.js"></script>
<script src="src/styles/pixel/config.js"></script>
<script src="src/styles/lowpoly-3d/config.js"></script>
<script src="src/config.js"></script>
<script src="src/preview.js"></script>
<script src="src/crop.js"></script>
<script src="src/loader.js"></script>
<script src="src/runtime.js"></script>
</body>
</html>
